<!DOCTYPE html>
<html>
<head>
    <title>CineReview Portal</title>
    <style>
        body {
            background: #141414;
            color: white;
            font-family: Arial;
            margin: 0;
        }
        header {
            background: #222;
            color: red;
            text-align: center;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }
        .movie {
            background: #222;
            width: 280px;
            padding: 20px;
            border-radius: 10px;
        }
        .poster {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
        }
        h3 { color: white; }
        .genre { color: red; }
        .rating { color: gold; }
    </style>
</head>
<body>

    <header>
        <h1>CineReview Portal</h1>
    </header>

    <div class="container">

        <div class="movie">
            <img class="poster" src="https://akm-img-a-in.tosshub.com/indiatoday/images/story/202404/kalki-2898-ad-poster-272528593-16x9_0.jpg?VersionId=37UEmeCjdsTPqMk6rJnUiXDZlI9tDYMI&size=690:388" alt="Movie 1">
            <h3>Cybernetic Dawn</h3>
            <p class="genre">Action / Sci-Fi</p>
            <p>A sci-fi story about fuature.</p>
            <p class="rating"> 4.5 / 5</p>
        </div>

        <div class="movie">
            <img class="poster" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTReFq39WFOge-RUhu1OfkQCSsjSK1p7nbjzsaFjWjZ-YTnr7Lf4iDZhbI&s=10" alt="Movie 2">
            <h3>The Hidden Realm</h3>
            <p class="genre">Action / mass movie</p>
            <p>konw about strong person.</p>
            <p class="rating">4.2 / 5</p>
        </div>

        <div class="movie">
            <img class="poster" src="https://images.moneycontrol.com/static-mcnews/2026/07/20260716060251_prabhasfauzi.png" alt="Movie 3">
            <h3>Echoes of Time</h3>
            <p class="genre">Drama / action</p>
            <p>A story about choices, consequences and time loops.</p>
            <p class="rating">4.8 / 5</p>
        </div>

    </div>

</body>
</html>
