<!DOCTYPE html>
<html>
<head>
<title>Login and Register</title>
<style>
body {
    font-family: Arial;
    background: #eef2f3;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.box {
    background: white;
    padding: 25px;
    width: 300px;
    border-radius: 10px;
}
button, input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
}
button {
    background: #3498db;
    color: white;
    border: none;
    cursor: pointer;
}
form { display: none; }
.active { display: block; }
</style>
</head>

<body>
<div class="box">

<button onclick="show('login')">Login</button>
<button onclick="show('register')">Register</button>

<form id="login" class="active">
    <h2>Login</h2>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button>Login</button>
</form>

<form id="register">
    <h2>Register</h2>
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" minlength="6" required>
    <button>Register</button>
</form>

</div>

<script>
function show(page) {
    document.getElementById("login").className = "";
    document.getElementById("register").className = "";
    document.getElementById(page).className = "active";
}

document.querySelectorAll("form").forEach(form => {
    form.onsubmit = function(e) {
        e.preventDefault();
        alert("Form submitted successfully!");
    };
});
</script>
</body>
</html>
